name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # check-latest: the runner's cached Node 22 can trail the newest patch
      # release, and Astro sets a patch-level minimum (7.4.2 needs >=22.23.4).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API documentation coverage
        run: pnpm run docs:check

      - name: Build Astro site
        run: pnpm run build
