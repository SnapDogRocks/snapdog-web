name: Update SnapDog OS Installer release

on:
  repository_dispatch:
    types:
      - snapdog-os-installer-release
  workflow_dispatch:
    inputs:
      tag:
        description: Published vX.Y.Z SnapDog OS Installer tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-snapdog-os-installer-release
  cancel-in-progress: false

jobs:
  update:
    name: Validate links and open update PR
    runs-on: ubuntu-24.04
    # The GitHub App credentials live in this environment, which only the main branch may use.
    environment: release
    steps:
      # A short-lived installation token of the release app replaces the personal access token that
      # expired in 2026-11 and made this workflow fail at the checkout. The token is for this
      # repository only. Pushes and pull requests made with it start the CI, which GITHUB_TOKEN's
      # would not.
      - name: Mint short-lived release automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: SnapDogRocks
          repositories: snapdog-web
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # pnpm/action-setup reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Update release metadata from published assets
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: node scripts/update-installer-release.mjs "$TAG"

      - name: Verify website
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs:check
          pnpm run build

      - name: Create or update pull request and arm auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/snapdog-os-installer-release.json; then
            echo "Website already references $TAG"
            exit 0
          fi

          BRANCH="automation/update-installer-release"
          git config user.name "snapdog-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/snapdog-os-installer-release.json
          git commit -m "chore: update SnapDog OS Installer to $TAG"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          PR_URL="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$PR_URL" ]]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update SnapDog OS Installer to $TAG" \
              --body "Updates the shared SnapDog OS Installer release metadata after validating every published installer. This PR is generated by the SnapDog OS Installer release workflow.")"
          fi
          gh pr merge "$PR_URL" --auto --squash
